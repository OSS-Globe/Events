name: Barbie LGTM Labeler

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  add-lgtm-label:
    name: Add LGTM Label
    runs-on: ubuntu-latest
    # Run only if:
    # 1. It is a comment on a pull request
    # 2. The author of the comment is Barbie (barbierajput378-pixel)
    # 3. The comment starts with /LGTM (case-insensitive)
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'barbierajput378-pixel' &&
      startsWith(github.event.comment.body, '/lgtm')

    steps:
      - name: Apply "LGTM !!" Label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['LGTM !!']
            })
